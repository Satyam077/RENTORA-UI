<div class="blogs-container">
    <div class="blogs-header">
        <h1>Our Blog</h1>
        <p class="blogs-subtitle">Insights, updates, and stories from the Rentmizo team.</p>
    </div>

    <div class="blogs-grid">
        <article class="blog-post" *ngFor="let blog of blogs">
            <div class="blog-image-wrapper">
                <div class="blog-image-placeholder">
                    <!-- Dynamic gradient based on ID to distinguish posts visually -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice"
                        *ngIf="blog.id % 2 !== 0">
                        <defs>
                            <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#c2407c;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#6b2c5c;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <rect width="100%" height="100%" fill="url(#grad1)" />
                        <circle cx="10%" cy="10%" r="50" fill="white" fill-opacity="0.1" />
                        <path d="M0 300 Q 400 200 800 300 L 800 400 L 0 400 Z" fill="white" fill-opacity="0.05" />
                    </svg>

                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice"
                        *ngIf="blog.id % 2 === 0">
                        <defs>
                            <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <rect width="100%" height="100%" fill="url(#grad2)" />
                        <circle cx="80%" cy="20%" r="60" fill="white" fill-opacity="0.1" />
                        <path d="M0 100 Q 400 200 800 100 L 800 0 L 0 0 Z" fill="white" fill-opacity="0.05" />
                    </svg>

                    <div class="category-badge">{{ blog.category }}</div>
                </div>
            </div>

            <div class="blog-content">
                <div class="blog-meta">
                    <span class="blog-date">{{ blog.date }}</span>
                    <span class="blog-separator">•</span>
                    <span class="blog-author">By {{ blog.author }}</span>
                </div>

                <h2 class="blog-title">{{ blog.title }}</h2>

                <div class="blog-body" [innerHTML]="blog.content"></div>
            </div>
        </article>
    </div>
</div>
