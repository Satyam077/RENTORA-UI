<div class="faq-container">
  <div class="faq-header">
    <h1>Frequently Asked Questions</h1>
    <p class="faq-subtitle">Everything you need to know about Rentmizo PMS</p>
  </div>

  <div class="faq-list">
    <div class="faq-item" *ngFor="let faq of faqs; let i = index" [class.active]="faq.isOpen">
      <div class="faq-question" (click)="toggleFaq(i)">
        <span class="question-text">{{ faq.question }}</span>
        <span class="toggle-icon">
          <svg *ngIf="!faq.isOpen" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <svg *ngIf="faq.isOpen" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </span>
      </div>
      <div class="faq-answer" [class.show]="faq.isOpen">
        <div class="answer-content">
          {{ faq.answer }}
        </div>
      </div>
    </div>
  </div>
</div>
