<header class="top-nav">
    <div class="nav-left">
        <button class="menu-toggle" (click)="toggleSidebar()">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>

        <div class="search-bar">
            <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.35-4.35"></path>
            </svg>
            <input type="text" placeholder="Search properties, tenants, invoices...">
        </div>
    </div>

    <div class="nav-right">
        <button class="notification-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span class="notification-badge">3</span>
        </button>

        <div class="user-profile-wrapper">
            <div class="user-profile" (click)="toggleProfileDropdown()">
                <div class="user-avatar" [class.has-image]="getProfileImageUrl()">
                    <img *ngIf="getProfileImageUrl()" [src]="getProfileImageUrl()" [alt]="currentUser?.user?.fullName || 'User'"
                         onerror="this.style.display='none'; this.parentElement.classList.remove('has-image');">
                    <span *ngIf="!getProfileImageUrl()">{{ getUserInitials() }}</span>
                </div>
            </div>

            <!-- Profile Dropdown -->
            <div class="profile-dropdown" *ngIf="isProfileDropdownOpen" (click)="$event.stopPropagation()">
                <div class="dropdown-header">
                    <div class="dropdown-title">My Account</div>
                </div>
                <div class="dropdown-menu">
                    <button type="button" class="dropdown-item" (click)="goToProfile()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <span>Profile</span>
                    </button>
                    <button type="button" class="dropdown-item" (click)="goToSettings()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path
                                d="M12 1v6m0 6v6m5.2-13.2l-4.2 4.2m0 6l4.2 4.2M23 12h-6m-6 0H1m18.2 5.2l-4.2-4.2m0-6l4.2-4.2">
                            </path>
                        </svg>
                        <span>Settings</span>
                    </button>
                    <div class="dropdown-divider"></div>
                    <button type="button" class="dropdown-item logout" (click)="logout()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        <span>Logout</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</header>

<!-- Click outside to close dropdown -->
<div class="dropdown-overlay" *ngIf="isProfileDropdownOpen" (click)="closeProfileDropdown()"></div>
