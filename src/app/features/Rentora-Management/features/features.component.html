<div class="features-container">
  <!-- Header -->
  <div class="features-header">
    <div class="header-left">
      <div class="header-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </div>
      <div>
        <h1>Features</h1>
        <p>Create and manage features that can be assigned to subscription plans</p>
      </div>
    </div>
    <button class="btn-primary" (click)="openCreateModal()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 5v14M5 12h14" />
      </svg>
      Add Feature
    </button>
  </div>

  <!-- Features List -->
  <div class="features-list">
    <div *ngFor="let cat of categories">
      <!-- Filter features by category to show headers if desired, or just list all sorted -->
      <!-- Let's iterate categories -->
      <div class="category-section" *ngIf="getFeaturesByCategory(cat).length > 0">
        <h3 class="category-title">{{ cat | uppercase }}</h3>

        <div class="feature-card" *ngFor="let feature of getFeaturesByCategory(cat)">
          <div class="feature-content">
            <div class="feature-icon">
              <img *ngIf="feature.imageUrl" [src]="feature.imageUrl" alt="icon" class="feature-img">
              <svg *ngIf="!feature.imageUrl" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" class="default-icon">
                <path d="M5 13l4 4L19 7" />
              </svg>
            </div>
            <div class="feature-info">
              <h4>{{ feature.name }}</h4>
              <p>{{ feature.description }}</p>
            </div>
          </div>
          <div class="feature-actions">
            <span class="badge" [ngClass]="cat.toLowerCase()">{{ cat }}</span>
            <button class="btn-icon" (click)="openEditModal(feature)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
              </svg>
            </button>
            <button class="btn-icon delete" (click)="deleteFeature(feature.id!)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-backdrop" *ngIf="showModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>{{ isEditMode ? 'Edit Feature' : 'Create New Feature' }}</h2>
        <button class="close-btn" (click)="closeModal()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <p class="modal-desc">Add a new feature that can be included in subscription plans</p>

        <div class="form-group">
          <label>Feature Name *</label>
          <input type="text" [(ngModel)]="currentFeature.name" placeholder="e.g., Online Payments" class="form-control">
        </div>

        <div class="form-group">
          <label>Description</label>
          <input type="text" [(ngModel)]="currentFeature.description" placeholder="e.g., Accept rent payments online"
            class="form-control">
        </div>

        <div class="form-group">
          <label>Category</label>
          <div class="category-pills">
            <button *ngFor="let cat of categories" [class.active]="currentFeature.category === cat"
              (click)="selectCategory(cat)" class="pill-btn">
              {{ cat }}
            </button>
          </div>
        </div>

        <div class="form-group">
          <label>Feature Image</label>
          <input type="file" (change)="onFileSelected($event)" accept="image/*" class="form-control">
          <div *ngIf="imagePreview" class="image-preview">
            <img [src]="imagePreview" alt="Preview">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" (click)="closeModal()">Cancel</button>
        <button class="btn-primary" (click)="saveFeature()">{{ isEditMode ? 'Update Feature' : 'Create Feature'
          }}</button>
      </div>
    </div>
  </div>
</div>
