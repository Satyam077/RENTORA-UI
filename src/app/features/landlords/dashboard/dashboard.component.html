<div class="dashboard-container">
  <!-- Page Header -->
  <div class="page-header">
    <h1 class="mat-headline-4 page-title">Dashboard</h1>
    <p class="mat-subtitle-1 page-subtitle">Welcome back! Here's your property overview.</p>
  </div>

  <!-- Stats Grid -->
  <div class="stats-grid">
    <mat-card class="stat-card" *ngFor="let stat of stats">
      <mat-card-content>
        <div class="stat-header">
          <div class="stat-info">
            <span class="stat-title">{{ stat.title }}</span>
            <div class="stat-value-container">
              <h2 class="stat-value">{{ stat.value }}</h2>
            </div>
          </div>
          <div class="stat-icon-container" [style.background-color]="stat.iconBg" [style.color]="stat.iconColor">
            <mat-icon>{{ stat.icon }}</mat-icon>
          </div>
        </div>

        <mat-divider></mat-divider>

        <div class="stat-footer">
          <span class="stat-change" [class.positive]="stat.changePositive" [class.negative]="!stat.changePositive">
            <mat-icon class="change-icon">{{ stat.changePositive ? 'trending_up' : 'trending_down' }}</mat-icon>
            {{ stat.change }}
          </span>
          <span class="stat-subtitle" *ngIf="stat.subtitle">{{ stat.subtitle }}</span>
          <span class="stat-subtitle" *ngIf="!stat.subtitle">Since last month</span>
        </div>
      </mat-card-content>
    </mat-card>
  </div>

  <!-- Main Content Grid -->
  <div class="content-grid">
